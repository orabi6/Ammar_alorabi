  const translations = {
    en: {
      title: "📝 Articles",
      subtitle: "Practical ideas and experience in digital marketing and e-commerce management.",
      content: `
        <article>
          <h2>How to Choose a Professional Digital Marketer for Your Store</h2>
          <p>Many store owners look for a digital marketer without knowing the right criteria for choosing one, and end up working with someone unqualified who wastes their ad budget with no real results. When choosing a digital marketer for your business, make sure of these points:</p>
          <p>First, ask for real examples of past campaigns they managed, with clear numbers such as return on ad spend, not just general talk about experience. Second, make sure they understand at least two advertising platforms (such as Google Ads and Snapchat or Facebook), since each platform needs a different targeting approach. Third, ask how they analyze performance and deliver reports — a professional marketer gives you a clear, periodic report, not confusing numbers without explanation.</p>
          <p>Finally, be cautious of anyone who promises exaggerated or "guaranteed" results in a very short time. Successful digital marketing relies on continuous testing and optimization, not magic solutions.</p>
        </article>

        <article>
          <h2>5 Common Mistakes in Managing Google &amp; Snapchat Ad Campaigns</h2>
          <p>Managing ad campaigns looks easy from the outside, but most store owners fall into repeated mistakes that cost them a large budget without real sales. The most notable of these mistakes are:</p>
          <p>The first mistake is targeting an audience that is too broad without precisely defining the segment actually interested in the product. The second is relying on a single ad image or video for too long without testing different creatives to see which performs best. The third is stopping a campaign too quickly before enough time has passed to collect real data to judge its results.</p>
          <p>The fourth mistake is ignoring the landing page or the store itself — even with a great ad, if the user experience on the site is slow or unclear, the visitor won't buy. The fifth and most common mistake is not tracking conversions correctly, which makes the store owner judge a campaign's success or failure based on personal impression instead of accurate numbers.</p>
        </article>

        <article>
          <h2>Why Your Online Store Needs SEO Alongside Paid Ads</h2>
          <p>Many store owners rely entirely on paid ads and stop getting any visitors the moment they pause their ad budget. Search engine optimization (SEO) solves this problem by building a steady stream of visitors that keeps coming even without daily ad spend.</p>
          <p>SEO also builds more trust than ads, since people tend to trust a store that appears naturally in search results more than one that only appears as a paid ad. On top of that, well-optimized product pages — with clear titles, real descriptions, and fast loading speed — convert visitors into buyers at a noticeably higher rate.</p>
          <p>The ideal approach is not to choose between ads and SEO, but to combine both: ads for fast, immediate results, and SEO for sustainable growth that reduces your cost per customer over time.</p>
        </article>

        <article>
          <h2>How to Measure the Success of Your Snapchat Ad Campaign</h2>
          <p>Many advertisers judge their Snapchat campaign only by impressions or reach, which are misleading numbers that don't reflect real results. To properly measure success, focus on these indicators instead:</p>
          <p>Click-through rate (CTR) shows how compelling your creative and message actually are. Cost per action (CPA) or cost per purchase shows whether the campaign is truly profitable, not just popular. Return on ad spend (ROAS) is the most important number of all, since it directly compares what you spent to what you earned.</p>
          <p>It's also essential to properly set up the tracking pixel on your store from day one, since without accurate tracking, none of these numbers can be trusted — and you lose the ability to retarget people who showed interest but didn't purchase yet.</p>
        </article>
      `
    },
    ar: {
      title: "📝 مقالات",
      subtitle: "أفكار وخبرات عملية في التسويق الإلكتروني وإدارة المتاجر الإلكترونية.",
      content: `
        <article>
          <h2>كيف تختار مسوق إلكتروني محترف لمتجرك؟</h2>
          <p>كثير من أصحاب المتاجر يبحثون عن مسوق إلكتروني دون معرفة المعايير الصحيحة للاختيار، وينتهي بهم الأمر بالتعامل مع شخص غير متخصص يهدر ميزانيتهم الإعلانية بلا نتائج حقيقية. عند اختيار مسوق إلكتروني أو مسوق رقمي لمشروعك، تأكد من توفر هذه النقاط:</p>
          <p>أولاً، اطلب أمثلة حقيقية على حملات سابقة أدارها، مع أرقام واضحة مثل نسبة العائد على الإنفاق الإعلاني، وليس فقط كلاماً عاماً عن الخبرة. ثانياً، تأكد أنه يفهم منصتين على الأقل من منصات الإعلان (مثل إعلانات جوجل وسناب شات أو فيسبوك)، لأن كل منصة تحتاج أسلوباً مختلفاً في الاستهداف. ثالثاً، اسأله عن طريقة تحليل الأداء وتقديم التقارير، فالمسوق المحترف يقدم لك تقريراً دورياً مفهوماً وليس أرقاماً معقدة بلا تفسير.</p>
          <p>وأخيراً، انتبه لمن يعدك بنتائج مبالغ فيها أو "مضمونة" في وقت قصير جداً، فالتسويق الإلكتروني الناجح يعتمد على اختبار وتحسين مستمر وليس حلولاً سحرية.</p>
        </article>

        <article>
          <h2>٥ أخطاء شائعة في إدارة الحملات الإعلانية على جوجل وسناب شات</h2>
          <p>إدارة الحملات الإعلانية تبدو سهلة من الخارج، لكن أغلب أصحاب المتاجر يقعون في أخطاء متكررة تكلفهم ميزانية كبيرة بلا مبيعات حقيقية. من أبرز هذه الأخطاء:</p>
          <p>الخطأ الأول هو استهداف جمهور واسع جداً دون تحديد دقيق للفئة المهتمة فعلاً بالمنتج. الخطأ الثاني هو الاعتماد على صورة أو فيديو إعلاني واحد لفترة طويلة دون تجربة نسخ إعلانية مختلفة لمعرفة الأفضل أداءً. الخطأ الثالث هو إيقاف الحملة بسرعة قبل مرور وقت كافٍ لجمع بيانات حقيقية تسمح بالحكم على نتائجها.</p>
          <p>الخطأ الرابع هو تجاهل صفحة الهبوط أو المتجر نفسه، فحتى مع إعلان ممتاز، إذا كانت تجربة المستخدم داخل الموقع بطيئة أو غير واضحة فلن يشتري الزائر. أما الخطأ الخامس والأكثر شيوعاً، فهو عدم تتبع التحويلات بشكل صحيح، ما يجعل صاحب المتجر يحكم على نجاح الحملة أو فشلها بناءً على انطباع شخصي بدلاً من أرقام دقيقة.</p>
        </article>

        <article>
          <h2>لماذا يحتاج متجرك الإلكتروني لتحسين محركات البحث (SEO) بجانب الإعلانات؟</h2>
          <p>كثير من أصحاب المتاجر يعتمدون بشكل كامل على الإعلانات المدفوعة، وبمجرد إيقاف الميزانية الإعلانية تتوقف الزيارات تماماً. تحسين محركات البحث يحل هذه المشكلة عبر بناء تدفق ثابت من الزوار يستمر حتى بدون إنفاق إعلاني يومي.</p>
          <p>كما أن تحسين محركات البحث يبني ثقة أكبر من الإعلانات، لأن الناس تميل لثقة أكبر بمتجر يظهر بشكل طبيعي في نتائج البحث مقارنة بمتجر يظهر فقط كإعلان مدفوع. إضافة إلى ذلك، صفحات المنتجات المُحسّنة جيداً بعناوين واضحة، وأوصاف حقيقية، وسرعة تحميل جيدة، تحوّل الزوار إلى مشترين بمعدل أعلى بشكل ملحوظ.</p>
          <p>الأسلوب الأمثل ليس الاختيار بين الإعلانات وتحسين محركات البحث، بل الجمع بينهما: إعلانات لنتائج سريعة وفورية، وتحسين محركات البحث لنمو مستدام يقلل تكلفة اكتساب العميل مع الوقت.</p>
        </article>

        <article>
          <h2>كيف تقيس نجاح حملتك الإعلانية على سناب شات؟</h2>
          <p>كثير من المعلنين يحكمون على نجاح حملتهم على سناب شات بناءً على عدد المشاهدات أو الوصول فقط، وهذه أرقام مضللة لا تعكس النتيجة الحقيقية. لقياس النجاح بشكل صحيح، ركّز على هذه المؤشرات بدلاً من ذلك:</p>
          <p>معدل النقر (CTR) يوضح مدى جاذبية إعلانك ورسالتك فعلياً. تكلفة الإجراء (CPA) أو تكلفة الشراء توضح إذا كانت الحملة مربحة فعلاً وليست فقط منتشرة. العائد على الإنفاق الإعلاني (ROAS) هو أهم رقم على الإطلاق، لأنه يقارن مباشرة بين ما أنفقته وما حققته من إيرادات.</p>
          <p>من الضروري أيضاً ضبط بكسل التتبع في متجرك بشكل صحيح منذ اليوم الأول، لأنه بدون تتبع دقيق، لا يمكن الوثوق بأي من هذه الأرقام، وتفقد أيضاً القدرة على إعادة استهداف من أبدوا اهتماماً ولم يشتروا بعد.</p>
        </article>
      `
    }
  };

  function applyLang(lang) {
    htmlTag.lang = lang;
    document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('pageTitle').innerHTML = translations[lang].title;
    document.getElementById('pageSubtitle').innerHTML = translations[lang].subtitle;
    document.getElementById('contentBox').innerHTML = translations[lang].content;
    langToggle.textContent = lang === 'en' ? 'AR | EN' : 'EN | AR';
  }

  window.addEventListener('DOMContentLoaded', () => applyLang(currentLang));
  langToggle.addEventListener('click', () => {
    currentLang = currentLang === 'en' ? 'ar' : 'en';
    localStorage.setItem('lang', currentLang);
    applyLang(currentLang);
  });
})();
</script>
